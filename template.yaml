AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: E-waste Management System — API + DynamoDB + S3 + CloudFront

# ─────────────────────────────────────────────────────────────────────────────
# Global defaults for all Lambda functions
# ─────────────────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        PRODUCTS_TABLE: !Ref ProductsTable
        PAYMENTS_TABLE: !Ref PaymentsTable
        UPLOADS_BUCKET: !Ref UploadsBucket
        JWT_SECRET: !Sub '{{resolve:ssm:/ewaste/JWT_SECRET}}'

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ── Lambda Function ──────────────────────────────────────────────────────
  EwasteApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ewaste-api-${Stage}'
      CodeUri: backend/
      Handler: lambda.handler
      Description: Express API wrapped with serverless-express
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref EwasteHttpApi
            Path: /{proxy+}
            Method: ANY
        ApiHealthcheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref EwasteHttpApi
            Path: /api/health
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PaymentsTable
        - S3CrudPolicy:
            BucketName: !Ref UploadsBucket

  # ── HTTP API (API Gateway v2) ────────────────────────────────────────────
  EwasteHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  # ── DynamoDB: Users Table ─────────────────────────────────────────────────
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: ewaste-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: role
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: RoleIndex
          KeySchema:
            - AttributeName: role
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── DynamoDB: Products Table ──────────────────────────────────────────────
  ProductsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: ewaste-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pid
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: entity
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: pid
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: AllProductsIndex
          KeySchema:
            - AttributeName: entity
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── DynamoDB: Payments Table ──────────────────────────────────────────────
  PaymentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: ewaste-payments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pid
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: entity
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: pid
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: AllPaymentsIndex
          KeySchema:
            - AttributeName: entity
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── S3: Uploads Bucket (product photos) ──────────────────────────────────
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ewaste-uploads-${Stage}-${AWS::AccountId}'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ['*']
            MaxAge: 3600

  # ── S3: Frontend Site Bucket ──────────────────────────────────────────────
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ewaste-site-${Stage}-${AWS::AccountId}'

  # ── CloudFront Origin Access Control ─────────────────────────────────────
  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'ewaste-site-oac-${Stage}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── S3 Bucket Policy: allow CloudFront OAC ───────────────────────────────
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  # ── CloudFront Distribution ───────────────────────────────────────────────
  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          AllowedMethods: [GET, HEAD]
        # Return index.html for 403/404 so React Router handles client-side routes
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: HTTP API endpoint URL
    Value: !Sub 'https://${EwasteHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  CloudFrontUrl:
    Description: CloudFront distribution URL (use as VITE_API_URL base)
    Value: !Sub 'https://${SiteDistribution.DomainName}'

  SiteBucketName:
    Description: S3 bucket to sync client/dist into
    Value: !Ref SiteBucket

  UploadsBucketName:
    Description: S3 bucket for product photo uploads
    Value: !Ref UploadsBucket
